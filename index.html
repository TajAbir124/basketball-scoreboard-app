<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
                
    </head>
    <body>
        <div class="container">
            <div class="team">
                <h3 class="txt">HOME</h3>
                <div class="scoreboard">
                    <div class="score" id="home-score">
                        0
                    </div>
                </div>
                <div class="inc">
                    <button class="btn" onclick="addScore('home',1)">+1</button>
                    <button class="btn" onclick="addScore('home',2)">+2</button>
                    <button class="btn" onclick="addScore('home',3)">+3</button>
                </div>                                 
            </div>
            <div class="team">
                <h3 class="txt">GUEST</h3>
                <div class="scoreboard">
                    <div class="score" id="guest-score">
                        0
                    </div>
                </div>
                <div class="inc">
                    <button class="btn"  onclick="addScore('guest',1)">+1</button>
                    <button class="btn"  onclick="addScore('guest',2)">+2</button>
                    <button class="btn"  onclick="addScore('guest',3)">+3</button>
                </div> 
                
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
